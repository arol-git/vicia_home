[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "sh -c '(while true; do php mqtt/subscriber.php; code=$?; echo \"[MQTT supervisor] subscriber arrêté (code=$code), redémarrage dans 2 secondes\"; sleep 2; done) & PHP_CLI_SERVER_WORKERS=4 exec php -S 0.0.0.0:$PORT -t public public/router.php'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

