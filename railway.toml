[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "sh -c 'mkdir -p storage/logs && (while true; do php mqtt/subscriber.php >> storage/logs/mqtt.log 2>&1; echo \"[MQTT supervisor] subscriber arrêté, redémarrage dans 2 secondes\" >> storage/logs/mqtt.log; sleep 2; done) & PHP_CLI_SERVER_WORKERS=4 exec php -S 0.0.0.0:$PORT -t public public/router.php'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

